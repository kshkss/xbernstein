[project]
name = "xbernstein"
version = "0.1.0"
description = "JAX-compatible Bernstein polynomial operations for tensor-product, simplex, and rational functions."
readme = "README.md"
authors = [
    { name = "Akishika, Issui", email = "kshkss@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beartype>=0.22.9",
    "equinox>=0.13.8",
    "jax>=0.10.2",
    "jaxtyping>=0.3.11",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venv = ".venv"
venvPath = "."

[tool.ruff]
lint.ignore=["F722"]

[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.50",
]
